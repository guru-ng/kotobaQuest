    <!-- Launch animation: only when opened from the home screen, once per launch.
         src/utils/splash.ts removes it once the app has drawn. -->
    <script>
      (function () {
        try {
          var installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
          if (installed && !sessionStorage.getItem('kq_splash')) {
            sessionStorage.setItem('kq_splash', '1');
            document.documentElement.classList.add('kq-splash-on');
            window.__kqSplashStart = performance.now();
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #kq-splash { display: none; }
      .kq-splash-on, .kq-splash-on body { background: #020617; }
      .kq-splash-on #kq-splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #020617; color: #f8fafc;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 200ms ease-out;
        /* If the app never starts, don't cover the page forever */
        animation: kq-splash-failsafe 1ms 6s forwards;
      }
      #kq-splash.kq-splash-out { opacity: 0; pointer-events: none; }
      #kq-splash .logo { width: 96px; height: 96px; position: relative; }
      #kq-splash .seal { display: block; width: 96px; height: 96px; overflow: visible; transform-origin: 50% 50%;
        opacity: 0; animation: kq-drop 380ms cubic-bezier(.5,0,.2,1) forwards; }
      #kq-splash .ring { position: absolute; inset: 0; border: 2px solid #f43f5e; border-radius: 21px;
        opacity: 0; animation: kq-ring 520ms 250ms ease-out forwards; }
      #kq-splash .word { margin-top: 22px; font-weight: 800; font-size: 20px; letter-spacing: -0.01em;
        opacity: 0; animation: kq-rise 320ms 380ms ease-out forwards; }
      #kq-splash .word span { color: #f43f5e; }
      @keyframes kq-drop { 0% { transform: scale(1.45); opacity: 0 } 35% { opacity: 1 } 66% { transform: scale(.93) } 100% { transform: scale(1); opacity: 1 } }
      @keyframes kq-ring { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(1.55); opacity: 0 } }
      @keyframes kq-rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes kq-splash-failsafe { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #kq-splash .seal, #kq-splash .word { animation: none; opacity: 1; }
        #kq-splash .ring { display: none; }
        .kq-splash-on #kq-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="kq-splash" aria-hidden="true">

        <svg class="seal" viewBox="0 0 96 96"><rect width="96" height="96" rx="21" fill="#f43f5e"/><text x="48" y="64.5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="900" font-size="45" fill="#fff">KQ</text></svg>
      </div>
